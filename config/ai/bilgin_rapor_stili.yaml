guvenlik:
  kimlik: "Sicil yalnızca güvenilir oturumdan alınır."
  yetki: >-
    Kanıt üretim anındaki yetkiyle toplanır. İlk ve sonraki önizlemeler, sonlandırma ve her indirme öncesinde
    görünürlük ve rıza yeniden doğrulanır. Yetkisi kalkan kanıta dayalı içerik yeniden kurulur ya da çıkarılır;
    yetki doğrulanamıyorsa işlem içerik döndürmez.
  model_girdisi: >-
    Model yalnızca yetkili kanıtı ve anlatı için gerekli kapsam/tamlık bilgisini alır.
    Sicil, erişim kararları ve yönetim kapsamı sunucuda kalır.
  kapsam: "FULL/PARTIAL/READ, proje/görev görünürlüğü ve yönetim kapsamı aynen uygulanır; rapor kapsamı yetki vermez."
  korunan_metin: "Görev notu ve iletiler yalnızca açık rızayla okunur; rıza başka rapora taşınmaz."
  gunluk: "Rapor, not ve belge içeriği uygulama günlüğüne yazılmaz; yalnızca içeriksiz telemetri tutulur."
  saklama: "4I'de rapor sunucuda kalıcı saklanmaz; kalıcı saklama ve teslim Aşama 4J'dir."
  yuzey: "4I-0 yeni uç, kalıcı tablo, arka plan işi ya da zamanlanmış görev eklemez."

insan_incelemesi:
  taslak: "Rapor yönetici sonlandırana dek taslaktır."
  sonlandirma_kosullari:
    - cozulmemis_kritik_sorun_yok
    - yayimlanacak_maddi_iddialarin_kanit_destegi_dogrulandi
    - nitelenen_ya_da_cikarilan_ifadelerin_isaretleri_onizlemede_gorunur
    - yapay_zeka_destegi_bildirimi_kaynak_notunda
  kullanici_duzenlemesi: >-
    Yöneticinin değiştirdiği bölümler belge özelliklerinde kaydedilir. Yöneticinin metin üzerindeki sorumluluğu,
    yayımlama öncesinde yetki ve maddi iddia desteğinin doğrulanması koşullarını kaldırmaz.

belge_kabulu:
  - "Word uyarı ya da onarım istemeden açar; bütün metin düzenlenebilir."
  - "A4 dikey, kenar boşlukları ve stil adları bu belgeyle aynıdır."
  - "Türkçe karakterler (ç, ğ, ı, İ, ö, ş, ü) bütün başlık, tablo ve grafiklerde doğrudur."
  - "Bütün sayfalar görsel olarak incelenir; taşma, yetim başlık ve okunmayan grafik yoktur."
  - "Kapak, üst/alt bilgi, sayfa numarası ve künye alanları tutarlıdır."
  - "Makro, gömülü nesne ve dış bağlantı yoktur."
