name: PR11 WBS Move Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr11-wbs-move-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Runtime version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Static architecture checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "calculateCpm" src/features --include='*.js' --include='*.jsx'; then
            echo 'Feature code must consume the shared schedule projection instead of calculating CPM directly.'
            exit 1
          fi
          if grep -R "data/mock" src/features --include='*.js' --include='*.jsx'; then
            echo 'Feature code must not import mock data directly.'
            exit 1
          fi
          if grep -R -E "baslangicTarihi|bitisTarihi" src --include='*.js' --include='*.jsx' | grep -v "src/data/legacy"; then
            echo 'Legacy schedule fields leaked outside the compatibility boundary.'
            exit 1
          fi
