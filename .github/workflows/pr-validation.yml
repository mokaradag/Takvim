name: PR Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run regression tests
        id: regression
        shell: bash
        run: |
          set +e
          node --test test/persistence-regressions.test.mjs > regression-tests.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run full test suite
        id: full_tests
        shell: bash
        run: |
          set +e
          npm test > full-tests.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            regression-tests.log
            full-tests.log
      - name: Enforce test results
        if: always()
        shell: bash
        run: |
          cat regression-tests.log
          cat full-tests.log
          test "${{ steps.regression.outputs.exit_code }}" = "0"
          test "${{ steps.full_tests.outputs.exit_code }}" = "0"
      - name: Build
        run: npm run build
