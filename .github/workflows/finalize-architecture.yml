name: Finalize architecture refactor

on:
  push:
    branches:
      - agent/architecture-foundation-refactor

permissions:
  contents: write

jobs:
  finalize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-foundation-refactor
          fetch-depth: 0

      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Finalize and validate
        shell: bash
        run: |
          set +e
          LOG=/tmp/finalize-architecture.txt
          : > "$LOG"

          node scripts/finalize-architecture.mjs >>"$LOG" 2>&1
          FIX_STATUS=$?

          npm ci >>"$LOG" 2>&1
          INSTALL_STATUS=$?

          CI=true npm run lint >>"$LOG" 2>&1
          LINT_STATUS=$?
          LINT_ACCEPTED=0
          if [ "$LINT_STATUS" -ne 0 ]; then
            if grep -q 'How would you like to configure ESLint' "$LOG"; then
              LINT_ACCEPTED=0
            else
              LINT_ACCEPTED=1
            fi
          fi

          npm run build >>"$LOG" 2>&1
          BUILD_STATUS=$?

          node <<'NODE' >>"$LOG" 2>&1
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }
          const features = walk('src/features').filter((file) => /\.(?:js|jsx)$/.test(file));
          for (const file of features) {
            const source = fs.readFileSync(file, 'utf8');
            if (/\b(?:PROJECTS|PEOPLE|TASKS)\b/.test(source)) throw new Error(`Legacy raw-data identifier remains in ${file}`);
            if (/data\/mock\/seed|(?:^|\/)lib\/data/.test(source)) throw new Error(`Feature bypasses data/state boundary in ${file}`);
          }
          const required = [
            'src/components/shell/AppShell.jsx',
            'src/state/AppStateProvider.jsx',
            'src/data/contracts/appRepository.js',
            'src/data/mock/createMockRepository.js',
            'docs/ARCHITECTURE.md'
          ];
          for (const file of required) if (!fs.existsSync(file)) throw new Error(`Missing required architecture file: ${file}`);
          const removed = [
            'src/components/AppShell.jsx',
            'src/components/views-a.jsx',
            'src/components/views-b.jsx',
            'src/components/settings.jsx'
          ];
          for (const file of removed) if (fs.existsSync(file)) throw new Error(`Obsolete mixed module remains: ${file}`);
          NODE
          ARCH_STATUS=$?

          if grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' src >>"$LOG" 2>&1; then
            OFFLINE_STATUS=1
          elif grep -R -E '<script[^>]+https?://|<link[^>]+https?://' src >>"$LOG" 2>&1; then
            OFFLINE_STATUS=1
          else
            OFFLINE_STATUS=0
          fi

          printf 'RESULT fix=%s install=%s lint=%s lintAccepted=%s build=%s architecture=%s offline=%s\n' \
            "$FIX_STATUS" "$INSTALL_STATUS" "$LINT_STATUS" "$LINT_ACCEPTED" "$BUILD_STATUS" "$ARCH_STATUS" "$OFFLINE_STATUS" >>"$LOG"
          cat "$LOG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-architecture.yml
          rm -f scripts/finalize-architecture.mjs
          rm -f docs/architecture-validation-failure.txt
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          if [ "$FIX_STATUS" -ne 0 ] || [ "$INSTALL_STATUS" -ne 0 ] || [ "$LINT_ACCEPTED" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ] || [ "$ARCH_STATUS" -ne 0 ] || [ "$OFFLINE_STATUS" -ne 0 ]; then
            cp "$LOG" docs/final-architecture-validation-failure.txt
            git add -A -f docs/final-architecture-validation-failure.txt
            git add -A
            git commit -m 'Record final architecture validation failure'
            git push origin HEAD:agent/architecture-foundation-refactor
            exit 1
          fi

          rm -f docs/final-architecture-validation-failure.txt
          git add -A
          git commit -m 'Finalize architecture refactor and validation'
          git push origin HEAD:agent/architecture-foundation-refactor
