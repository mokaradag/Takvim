name: Validate final CPM branch

on:
  push:
    branches:
      - agent/cpm-critical-path-engine

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/cpm-critical-path-engine
          fetch-depth: 0

      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Validate exact final head
        shell: bash
        run: |
          set +e
          LOG=/tmp/cpm-final-validation.txt
          : > "$LOG"

          npm ci >>"$LOG" 2>&1
          INSTALL_STATUS=$?
          CI=true npm run lint >>"$LOG" 2>&1
          LINT_STATUS=$?
          npm test >>"$LOG" 2>&1
          TEST_STATUS=$?
          npm run build >>"$LOG" 2>&1
          BUILD_STATUS=$?

          printf 'RESULT install=%s lint=%s test=%s build=%s\n' \
            "$INSTALL_STATUS" "$LINT_STATUS" "$TEST_STATUS" "$BUILD_STATUS" | tee -a "$LOG"
          cat "$LOG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/validate-cpm-final.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          if [ "$INSTALL_STATUS" -ne 0 ] || [ "$LINT_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ]; then
            cp "$LOG" docs/cpm-final-validation-failure.txt
            git add -A
            git commit -m 'Record final CPM validation failure'
            git push origin HEAD:agent/cpm-critical-path-engine
            exit 1
          fi

          rm -f docs/cpm-final-validation-failure.txt
          git add -A
          git commit -m 'Validate final CPM branch'
          git push origin HEAD:agent/cpm-critical-path-engine
