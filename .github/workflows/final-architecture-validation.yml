name: Final architecture validation

on:
  push:
    branches:
      - agent/architecture-foundation-refactor

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-foundation-refactor
          fetch-depth: 0

      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run final validation
        shell: bash
        run: |
          set +e
          LOG=/tmp/final-architecture-validation.txt
          : > "$LOG"

          run_check() {
            NAME="$1"
            shift
            echo "=== $NAME ===" | tee -a "$LOG"
            "$@" >>"$LOG" 2>&1
            STATUS=$?
            echo "STATUS $NAME=$STATUS" | tee -a "$LOG"
            return 0
          }

          run_check install npm ci
          INSTALL_STATUS=$(grep '^STATUS install=' "$LOG" | tail -1 | cut -d= -f2)

          echo '=== lint ===' | tee -a "$LOG"
          CI=true npm run lint >>"$LOG" 2>&1
          LINT_STATUS=$?
          echo "STATUS lint=$LINT_STATUS" | tee -a "$LOG"

          run_check build npm run build
          BUILD_STATUS=$(grep '^STATUS build=' "$LOG" | tail -1 | cut -d= -f2)

          echo '=== architecture ===' | tee -a "$LOG"
          (
            set -e
            test ! -e src/components/views-a.jsx
            test ! -e src/components/views-b.jsx
            test ! -e src/components/AppShell.jsx
            test ! -e src/components/settings.jsx
            test -e src/components/shell/AppShell.jsx
            test -e src/state/AppStateProvider.jsx
            test -e src/data/contracts/appRepository.js
            test -e src/data/mock/createMockRepository.js
            test -e docs/ARCHITECTURE.md
            ! grep -R -E '\b(PROJECTS|PEOPLE|TASKS)\b' src/features
            ! grep -R 'data/mock/seed' src/features
            ! grep -R 'lib/data' src/features
          ) >>"$LOG" 2>&1
          ARCH_STATUS=$?
          echo "STATUS architecture=$ARCH_STATUS" | tee -a "$LOG"

          echo '=== offline ===' | tee -a "$LOG"
          (
            set -e
            ! grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' src
            ! grep -R -E '<script[^>]+https?://|<link[^>]+https?://' src
          ) >>"$LOG" 2>&1
          OFFLINE_STATUS=$?
          echo "STATUS offline=$OFFLINE_STATUS" | tee -a "$LOG"

          printf 'RESULT install=%s lint=%s build=%s architecture=%s offline=%s\n' \
            "$INSTALL_STATUS" "$LINT_STATUS" "$BUILD_STATUS" "$ARCH_STATUS" "$OFFLINE_STATUS" | tee -a "$LOG"
          cat "$LOG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/final-architecture-validation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          if [ "$INSTALL_STATUS" -ne 0 ] || [ "$LINT_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ] || [ "$ARCH_STATUS" -ne 0 ] || [ "$OFFLINE_STATUS" -ne 0 ]; then
            cp "$LOG" docs/architecture-validation-failure.txt
            git add -A -f docs/architecture-validation-failure.txt
            git add -A
            git commit -m 'Record architecture validation diagnostics'
            git push origin HEAD:agent/architecture-foundation-refactor
            exit 1
          fi

          rm -f docs/architecture-validation-failure.txt
          git add -A
          git commit -m 'Confirm final architecture validation'
          git push origin HEAD:agent/architecture-foundation-refactor
