name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fifth-codex-fixes:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/durable-sqlserver-persistence' && github.event.pull_request.head.ref == 'agent/codex-fifth-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 33 branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-sqlserver-persistence
          fetch-depth: 0
      - name: Apply fifth Codex fixes
        run: python .github/scripts/apply-fifth-codex-review-fixes.py
      - name: Refresh superseded regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/codex-p2-regressions.test.mjs')
          text = path.read_text()
          replacements = [
            (
              "/JOIN dbo\\.MR_V_CorporateProjectAccess a ON a\\.ProjectCode = p\\.ProjectCode\\s+WHERE @isAdmin = 0 AND p\\.SourceType = 'CORPORATE' AND p\\.IsActive = 1 AND a\\.Sicil = @sicil/s",
              "/JOIN dbo\\.MR_V_CorporateProjectAccess a ON a\\.ProjectCode = UPPER\\(p\\.ProjectCode\\)\\s+WHERE @isAdmin = 0 AND p\\.SourceType = 'CORPORATE' AND p\\.IsActive = 1 AND a\\.Sicil = @sicil/s"
            ),
            (
              "/FROM dbo\\.MR_ProjectAccess pa\\s+JOIN dbo\\.MR_Projects p ON p\\.ProjectId = pa\\.ProjectId\\s+WHERE p\\.IsActive = 1 AND pa\\.Sicil = @sicil AND pa\\.IsActive = 1 AND pa\\.AccessLevel = 'FULL'/s",
              "/FROM dbo\\.MR_ProjectAccess pa\\s+JOIN dbo\\.MR_Projects p ON p\\.ProjectId = pa\\.ProjectId\\s+WHERE p\\.IsActive = 1 AND pa\\.Sicil = @sicil AND pa\\.IsActive = 1 AND pa\\.AccessLevel IN \\('FULL', 'READ'\\)/s"
            )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'superseded regression not found: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Check ProjectCode canonicalization regression
        run: node --test --test-name-pattern="ProjectCode is canonicalized" test/codex-p2-regressions.test.mjs
      - name: Check root WBS synchronization regression
        run: node --test --test-name-pattern="corporate sync updates the single default root WBS" test/codex-p2-regressions.test.mjs
      - name: Check READ grant regression
        run: node --test --test-name-pattern="project-level READ grants appear as PARTIAL" test/codex-p2-regressions.test.mjs
      - name: Check HR02 deterministic ranking regression
        run: node --test --test-name-pattern="HR02 people directory duplicate ranking" test/codex-p2-regressions.test.mjs
      - name: Check SQL int Sicil regression
        run: node --test --test-name-pattern="development identity rejects partial" test/codex-p2-regressions.test.mjs
      - name: Run fifth Codex regression tests
        run: node --test test/codex-p2-regressions.test.mjs
      - name: Run durable SQL contract tests
        run: node --test test/durable-persistence-sql.test.mjs
      - name: Run authorization tests
        run: node --test test/authorization.test.mjs
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
      - name: Commit fixes to PR 33 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/identity/parseDevelopmentSicil.js src/server/authorization/authorization.js src/server/authorization/loadAuthorizationContext.js src/server/repository/sqlAppRepository.js src/server/repository/corporateQueries.js database/MR_Create_Durable_Persistence.sql test/codex-p2-regressions.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix fifth Codex review findings"
          git push origin HEAD:agent/durable-sqlserver-persistence

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
