name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fifth-codex-fixes:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/durable-sqlserver-persistence' && github.event.pull_request.head.ref == 'agent/codex-fifth-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 33 branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-sqlserver-persistence
          fetch-depth: 0
      - name: Apply fifth Codex fixes
        run: python .github/scripts/apply-fifth-codex-review-fixes.py
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run fifth Codex regression tests
        run: node --test test/codex-p2-regressions.test.mjs
      - name: Run durable SQL contract tests
        run: node --test test/durable-persistence-sql.test.mjs
      - name: Run authorization tests
        run: node --test test/authorization.test.mjs
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
      - name: Commit fixes to PR 33 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/identity/parseDevelopmentSicil.js src/server/authorization/authorization.js src/server/authorization/loadAuthorizationContext.js src/server/repository/sqlAppRepository.js src/server/repository/corporateQueries.js database/MR_Create_Durable_Persistence.sql test/codex-p2-regressions.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix fifth Codex review findings"
          git push origin HEAD:agent/durable-sqlserver-persistence

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
