name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fifth-codex-fixes:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/durable-sqlserver-persistence' && github.event.pull_request.head.ref == 'agent/codex-fifth-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 33 branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-sqlserver-persistence
          fetch-depth: 0
      - name: Clean redundant ProjectCode normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('database/MR_Create_Durable_Persistence.sql')
          text = path.read_text()
          old = "UPPER(UPPER(NULLIF(LTRIM(RTRIM(projeKodu)), N''''))) AS ProjectCode"
          new = "UPPER(NULLIF(LTRIM(RTRIM(projeKodu)), N'''')) AS ProjectCode"
          if text.count(old) != 1:
              raise SystemExit(f'expected one redundant normalization, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
      - name: Commit cleanup to PR 33 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/MR_Create_Durable_Persistence.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean canonical ProjectCode SQL projection"
          git push origin HEAD:agent/durable-sqlserver-persistence

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
