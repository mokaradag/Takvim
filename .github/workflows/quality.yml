name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fourth-codex-fixes:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/durable-sqlserver-persistence' && github.event.pull_request.head.ref == 'agent/codex-fourth-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 33 branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-sqlserver-persistence
          fetch-depth: 0
      - name: Apply identity fix
        run: python .github/scripts/apply-fourth-codex-review-fixes.py identity
      - name: Apply sync and schema fixes
        run: python .github/scripts/apply-fourth-codex-review-fixes.py sync
      - name: Apply repository fixes
        run: python .github/scripts/apply-fourth-codex-review-fixes.py repository
      - name: Add regression tests
        run: python .github/scripts/apply-fourth-codex-review-fixes.py tests
      - name: Refresh prior regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/codex-p2-regressions.test.mjs')
          text = path.read_text()

          old_sync = """test('corporate project sync serializes concurrent first inserts by ProjectCode', () => {
            const source = read('src/server/repository/corporateQueries.js');
            assert.match(
              source,
              /NOT EXISTS \\(SELECT 1 FROM dbo\\.MR_Projects p WITH \\(UPDLOCK, HOLDLOCK\\) WHERE p\\.ProjectCode = source\\.ProjectCode\\)/
            );
          });"""
          new_sync = """test('corporate project sync serializes concurrent first inserts by ProjectCode', () => {
            const source = read('src/server/repository/corporateQueries.js');
            assert.match(
              source,
              /NOT EXISTS \\(\\s*SELECT 1\\s*FROM dbo\\.MR_Projects p WITH \\(UPDLOCK, HOLDLOCK\\)\\s*WHERE p\\.SourceType = 'CORPORATE' AND p\\.ProjectCode = source\\.ProjectCode\\s*\\)/s
            );
          });"""
          if old_sync not in text:
              raise SystemExit('prior corporate sync regression block not found')
          text = text.replace(old_sync, new_sync, 1)

          old_name = """test('corporate project view always supplies a usable ProjectName', () => {
            const source = read('database/MR_Create_Durable_Persistence.sql');
            assert.ok(source.includes(\"COALESCE(NULLIF(LTRIM(RTRIM(ProjeAdi)), N''''), NULLIF(LTRIM(RTRIM(ProjeKodu)), N'''')) AS ProjectName\"));
          });"""
          new_name = """test('corporate project view always supplies a usable ProjectName', () => {
            const source = read('database/MR_Create_Durable_Persistence.sql');
            const view = source.match(/CREATE VIEW dbo\\.MR_V_CorporateProjects AS([\\s\\S]*?)GROUP BY/i)?.[0] || '';
            assert.match(view, /COALESCE\\s*\\(\\s*NULLIF\\(LTRIM\\(RTRIM\\(ProjeAdi\\)\\)[\\s\\S]*NULLIF\\(LTRIM\\(RTRIM\\(ProjeKodu\\)\\)[\\s\\S]*AS ProjectName/i);
          });"""
          if old_name not in text:
              raise SystemExit('corporate ProjectName regression block not found')
          path.write_text(text.replace(old_name, new_name, 1))
          PY
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Check development identity regression
        run: node --test --test-name-pattern="development identity rejects partial" test/codex-p2-regressions.test.mjs
      - name: Check manual corporate code regression
        run: node --test --test-name-pattern="manual project codes cannot silently suppress" test/codex-p2-regressions.test.mjs
      - name: Check partial people regression
        run: node --test --test-name-pattern="partial-only snapshots constrain the people directory" test/codex-p2-regressions.test.mjs
      - name: Check corporate project name regression
        run: node --test --test-name-pattern="corporate project view always supplies" test/codex-p2-regressions.test.mjs
      - name: Check prior corporate sync regression
        run: node --test --test-name-pattern="corporate project sync serializes concurrent first inserts" test/codex-p2-regressions.test.mjs
      - name: Run fourth Codex regression tests
        run: node --test test/codex-p2-regressions.test.mjs
      - name: Run durable SQL contract tests
        run: node --test test/durable-persistence-sql.test.mjs
      - name: Run durable architecture tests
        run: node --test test/durable-persistence-architecture.test.mjs
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
      - name: Commit fixes to PR 33 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/identity/currentUserProvider.js src/server/identity/parseDevelopmentSicil.js src/server/repository/corporateQueries.js src/server/repository/sqlAppRepository.js database/MR_Create_Durable_Persistence.sql test/codex-p2-regressions.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix fourth Codex P2 review findings"
          git push origin HEAD:agent/durable-sqlserver-persistence

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
