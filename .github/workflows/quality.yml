name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-sixth-codex-fixes:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'agent/durable-sqlserver-persistence' && github.event.pull_request.head.ref == 'agent/codex-sixth-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 33 branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-sqlserver-persistence
          fetch-depth: 0
      - name: Preflight repository anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/server/repository/sqlAppRepository.js').read_text()
          checks = [
            "if (!/^\\d+$/.test(text) || !Number.isSafeInteger(sicil) || sicil <= 0) {",
            "DECLARE @VisibleProjects TABLE(ProjectId uniqueidentifier PRIMARY KEY, AccessLevel varchar(10));",
            "SELECT pa.ProjectId, CASE WHEN pa.AccessLevel = 'FULL' THEN 'FULL' ELSE 'PARTIAL' END",
            "WHERE visibleAssignee.Sicil = pd.Sicil",
            "const refs = request(executor);",
            "const wbsIds = new Set(changes.wbsUpserts.map((value) => value.id));"
          ]
          for value in checks:
            assert value in source, value
          PY
      - name: Preflight domain anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/domain/validation/wbsValidation.js').read_text()
          assert "export function validateWbsDeletion(wbs, tasks, wbsId)" in source
          assert "const childIds = (wbs || []).filter((node) => node.parentId === wbsId)" in source
          PY
      - name: Preflight state anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('src/state/appState.js').read_text()
          assert "function emptyApplicationData()" in source
          assert "function createStateFromSnapshot(snapshot = {}, previous = createLoadingState())" in source
          assert "WBS_HAS_TASKS: 'Doğrudan görev atanmış bir WBS silinemez.'" in source
          PY
      - name: Apply sixth Codex fixes
        run: python .github/scripts/apply-sixth-codex-review-fixes.py
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run sixth Codex regression tests
        run: node --test test/codex-p2-regressions.test.mjs
      - name: Run WBS domain validation tests
        run: node --test test/domain-validation-edge-cases.test.mjs
      - name: Run authorization tests
        run: node --test test/durable-authorization.test.mjs
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
      - name: Commit fixes to PR 33 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/repository/sqlAppRepository.js src/domain/validation/wbsValidation.js src/state/appState.js test/codex-p2-regressions.test.mjs test/domain-validation-edge-cases.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix sixth Codex review findings"
          git push origin HEAD:agent/durable-sqlserver-persistence

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        run: npm test -- --test-concurrency=1
      - name: Build production application
        run: npm run build
