name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run automated tests
        shell: bash
        run: |
          set +e
          npm test -- --test-concurrency=1 > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 250 test-output.log
            exit "$status"
          fi
          cat test-output.log
      - name: Build production application
        run: npm run build
