# Çoğu proje bu iş akışını değiştirmeden kullanabilir; yalnızca
# to commit it to your repository.
#
# İncelenen dilleri değiştirmek için bu dosya uyarlanabilir,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# Depo dilleri algılanmaya çalışıldı. Aşağıdaki
# language matrisi doğru dil kümesini içeriyor mu denetlenmelidir.
# Desteklenen CodeQL dilleri.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '32 4 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Koşucu boyutu CodeQL analiz süresini etkiler. Ayrıntılar:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (yalnızca GitHub.com)
    # Analizi hızlandırmak için daha geniş kaynaklı koşucu veya makine değerlendirilebilir.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # Bütün iş akışları için gereklidir.
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # Yalnızca özel depodaki iş akışları için gereklidir.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        # CodeQL language değerleri: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, rust, swift.
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # İncelenen dili veya derleme kipini değiştirme ayrıntıları:
        # https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # Derlenen dilde build-mode değiştirilerek inceleme uyarlanabilir;
        # ayrıntılar: https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Kurulum adımları github/codeql-action/init öncesine eklenir.
    # Derleyici veya çalışma zamanı kurulumu buna dahildir: actions/setup-node
    # ve benzerleri. Genellikle yalnızca elle derlemede gerekir.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Tarama için CodeQL araçlarını başlatır.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # Özel sorgu burada veya yapılandırma dosyasında belirtilebilir.
        # Buradaki sorgular varsayılan olarak dosyadakilerin yerini alır.
        # İki kaynağı birlikte kullanmak için listeye + öneki eklenir.

        # Sorgu paketi ayrıntısı: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # Analiz edilen dilde otomatik derleme başarısız olursa
    # We were unable to automatically build your code iletisi için yukarıdaki matris değiştirilir;
    # ilgili dilin derleme kipi manual yapılır ve bu adım uyarlanır.
    # to build your code.
    # İşletim sistemi kabuğunda çalışacak komut satırı programları.
    # Ayrıntılar: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
