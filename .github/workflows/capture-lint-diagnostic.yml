name: Capture persistence diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm test -- --test-concurrency=1 > test-diagnostic.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: test-diagnostic
          path: test-diagnostic.txt
