name: Capture lint diagnostic

on:
  push:
    branches:
      - agent/durable-sqlserver-persistence

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm run lint > lint-diagnostic.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostic
          path: lint-diagnostic.txt
