# Dependency Review Action
#
# Bu eylem PR içinde değişen bağımlılık bildirimlerini tarar,
# bildirilen veya güncellenen paketin bilinen açık içeren sürümünü gösterir.
# İş akışı zorunluysa bilinen açık getiren paketler
# birleştirmeyi engeller.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Dependency review'
on:
  pull_request:
    branches: [ "main" ]

# Bu akışta bağımlılık gönderme eylemi varsa izin şu değere ayarlanmalıdır:
#
# permissions:
#   contents: write
#
# https://docs.github.com/en/enterprise-cloud@latest/code-security/supply-chain-security/understanding-your-software-supply-chain/using-the-dependency-submission-api
permissions:
  contents: read
  # comment-summary-in-pr için PR yazma izni gerekir; seçenek kullanılmıyorsa izin kaldırılabilir.
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        # Yaygın seçenekler; tümü için: https://github.com/actions/dependency-review-action#configuration-options
        with:
          comment-summary-in-pr: always
        #   fail-on-severity: moderate
        #   deny-licenses: GPL-1.0-or-later, LGPL-2.0-or-later
        #   retry-on-snapshot-warnings: true
