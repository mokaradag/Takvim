name: Temporary apply UI refactor

on:
  push:
    branches:
      - agent/source-export-temp
    paths:
      - patch-ready.txt

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Assemble refactor patch
        shell: bash
        run: |
          cat patch-chunks/chunk-* | base64 --decode | gzip --decompress > /tmp/ui-style-refactor.patch
          git fetch origin agent/ui-style-consolidation-hardening
          git switch -C agent/ui-style-consolidation-hardening origin/agent/ui-style-consolidation-hardening
          git apply --check /tmp/ui-style-refactor.patch
          git apply /tmp/ui-style-refactor.patch

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run automated tests
        run: npm test -- --test-concurrency=1

      - name: Build production application
        run: npm run build

      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate UI styling architecture"
          git push origin HEAD:agent/ui-style-consolidation-hardening
