name: Architecture refactor validation

on:
  push:
    branches:
      - agent/architecture-foundation-refactor

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-foundation-refactor
          fetch-depth: 0

      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Generate, validate, and publish refactor
        shell: bash
        run: |
          set +e
          LOG=/tmp/architecture-refactor-validation.log
          {
            echo '=== Generate architecture refactor ==='
            node scripts/refactor-architecture.mjs
            echo '=== Install locked dependencies ==='
            npm ci
            echo '=== Lint ==='
            CI=true npm run lint
            echo '=== Production build ==='
            npm run build
            echo '=== Architecture boundary checks ==='
            test ! -e src/components/views-a.jsx
            test ! -e src/components/views-b.jsx
            test ! -e src/components/AppShell.jsx
            test ! -e src/components/settings.jsx
            test -e src/components/shell/AppShell.jsx
            test -e src/state/AppStateProvider.jsx
            test -e src/data/contracts/appRepository.js
            test -e src/data/mock/createMockRepository.js
            test -e docs/ARCHITECTURE.md
            ! grep -R 'data/mock/seed' src/features
            ! grep -R 'lib/data' src/features
            echo '=== Offline source checks ==='
            ! grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' src
            ! grep -R -E '<script[^>]+https?://|<link[^>]+https?://' src
          } >"$LOG" 2>&1
          STATUS=$?
          cat "$LOG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$STATUS" -ne 0 ]; then
            git reset --hard "$GITHUB_SHA"
            mkdir -p validation
            cp "$LOG" validation/architecture-refactor-failure.log
            rm -f .github/workflows/architecture-refactor.yml
            git add -A
            git commit -m 'Record architecture refactor validation failure'
            git push origin HEAD:agent/architecture-foundation-refactor
            exit "$STATUS"
          fi

          rm -f scripts/refactor-architecture.mjs
          rm -f .github/workflows/architecture-refactor.yml
          rm -rf validation
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'Refactor architecture foundation'
          git push origin HEAD:agent/architecture-foundation-refactor
