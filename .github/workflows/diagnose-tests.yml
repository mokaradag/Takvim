name: Diagnose Tests

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PR22 first pass
        continue-on-error: true
        run: node --test --test-reporter=dot test/pr22-codex-regressions.test.mjs

      - name: Exact npm test first pass
        continue-on-error: true
        run: npm test -- --test-reporter=dot

      - name: Exact npm test second pass
        continue-on-error: true
        run: npm test -- --test-reporter=dot

      - name: Exact production build
        continue-on-error: true
        run: npm run build
