name: Diagnose Tests

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact npm test command
        continue-on-error: true
        run: npm test -- --test-reporter=dot

      - name: Exact production build
        continue-on-error: true
        run: npm run build

      - name: Default Node test discovery
        continue-on-error: true
        run: node --test
