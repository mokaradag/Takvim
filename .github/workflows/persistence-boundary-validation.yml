name: Persistence boundary validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        id: tests
        continue-on-error: true
        run: npm test > test-output.txt 2>&1

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-boundary-test-output
          path: test-output.txt

      - name: Report test failure
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 100 test-output.txt
          exit 1

      - name: Build
        run: npm run build

      - name: Static architecture checks
        shell: bash
        run: |
          if grep -R "getSnapshot(" src; then
            echo "Synchronous getSnapshot usage remains under src."
            exit 1
          fi
          if grep -R -E "createMockRepository|/data/mock/|repository\." src/features; then
            echo "A feature imports or calls repository implementation details."
            exit 1
          fi
          if grep -R "localStorage" src/data; then
            echo "Business-data repository code references localStorage."
            exit 1
          fi
          if git diff HEAD^1 HEAD -- src package.json package-lock.json | grep '^+' | grep -E "https?://|fonts\.googleapis|cdn\."; then
            echo "A new external runtime URL or CDN reference was introduced."
            exit 1
          fi
