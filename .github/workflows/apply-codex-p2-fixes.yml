name: Apply Codex P2 fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/durable-lint-diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-sqlserver-persistence
          fetch-depth: 0
      - name: Patch state and SQL persistence regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          provider = Path('src/state/AppStateProvider.jsx')
          text = provider.read_text()
          marker = "  const updateTask = useCallback((id, patch) => persistence.updateTask(id, patch), [persistence]);\n\n"
          if marker not in text:
              raise SystemExit('updateTask marker not found')
          text = text.replace(
              marker,
              "  const updateTask = useCallback((id, patch) => persistence.updateTask(id, patch), [persistence]);\n  const flushPendingChanges = useCallback(() => persistence.flush(), [persistence]);\n\n",
              1
          )
          old = """    const committedProject = result.value?.projectUpserts?.find((project) => project.id === prepared.project.id)
      || prepared.project;
    const committedRoot = result.value?.wbsUpserts?.find((node) => node.id === prepared.rootWbs.id)
      || prepared.rootWbs;
    const latest = stateRef.current;

    applyStateAction({
      type: 'data/load-success',
      snapshot: {
        calendars: latest.calendars,
        projects: [...latest.projects, committedProject],
        people: latest.people,
        wbs: [...latest.wbs, committedRoot],
        tasks: latest.tasks,
        baselines: latest.baselines,
        taskBaselineSnapshots: latest.taskBaselineSnapshots
      }
    });
"""
          new = """    const committedProject = result.value?.projectUpserts?.find((project) => project.id === prepared.project.id)
      || prepared.project;
    const latest = stateRef.current;

    applyStateAction({
      type: 'data/load-success',
      snapshot: {
        calendars: latest.calendars,
        projects: mergeUpserts(latest.projects, [committedProject]),
        people: latest.people,
        wbs: latest.wbs,
        tasks: latest.tasks,
        baselines: latest.baselines,
        taskBaselineSnapshots: latest.taskBaselineSnapshots
      }
    });
"""
          if old not in text:
              raise SystemExit('Project create reconciliation block not found')
          text = text.replace(old, new, 1)
          actions_marker = """    updateTask,
    moveTaskToWbs,
"""
          if text.count(actions_marker) != 2:
              raise SystemExit(f'Expected two action markers, found {text.count(actions_marker)}')
          text = text.replace(actions_marker, """    updateTask,
    flushPendingChanges,
    moveTaskToWbs,
""", 2)
          provider.write_text(text)

          replace_once(
              'src/server/repository/sqlAppRepository.js',
              """    FROM dbo.MR_Tasks t
    JOIN dbo.MR_TaskAssignees ta ON ta.TaskId = t.TaskId
    WHERE @isAdmin = 0
""",
              """    FROM dbo.MR_Tasks t
    JOIN dbo.MR_Projects p ON p.ProjectId = t.ProjectId
    JOIN dbo.MR_TaskAssignees ta ON ta.TaskId = t.TaskId
    WHERE @isAdmin = 0 AND p.IsActive = 1
"""
          )
          replace_once(
              'src/server/repository/sqlAppRepository.js',
              """       SET WbsId = @wbsId, CalendarId = @calendarId, Title = @title,
""",
              """       SET ProjectId = @projectId, WbsId = @wbsId, CalendarId = @calendarId, Title = @title,
"""
          )
          replace_once(
              'src/server/repository/sqlAppRepository.js',
              """    dep.input('dependencyId', sql.UniqueIdentifier, uuid(dependency.id || randomUUID()));
""",
              """    dep.input('dependencyId', sql.UniqueIdentifier, randomUUID());
"""
          )
          PY
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/state/AppStateProvider.jsx src/server/repository/sqlAppRepository.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Codex P2 state and SQL persistence bugs"
          git push origin HEAD:agent/durable-sqlserver-persistence
