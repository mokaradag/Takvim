# Bu iş akışı GitHub tarafından onaylanmamış üçüncü taraf eylemler kullanır.
# Bu eylemler ayrı hizmet koşulu gizlilik politikası ve
# destek belgelerine tabidir.

name: Scorecard supply-chain security
on:
  # Dal koruma denetimi yalnızca varsayılan dalı destekler. Ayrıntılar:
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # Bakım denetiminin arada yenilenmesini sağlar. Ayrıntılar:
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: '41 7 * * 0'
  push:
    branches: [ "main" ]

# Varsayılan izinler salt okunur bildirilir.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results: true yalnızca varsayılan dalda çalışır; kapalıysa koşul kaldırılabilir.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Sonuçları kod tarama panosuna yüklemek için gereklidir.
      security-events: write
      # Sonuç yayımlamak ve rozet almak için gereklidir; aşağıdaki publish_results alanına bakılır.
      id-token: write
      # Özel depoya kurulumda aşağıdaki izinler açılır.
      # contents: read
      # actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          # İsteğe bağlı yazma PAT belirteci. Aşağıdaki durumlarda repo_token açılır:
          # - açık depoda dal koruma denetimi etkinleştirilecekse veya
          # - Scorecard özel depoya kuruluyorsa.
          # PAT oluşturma adımları: https://github.com/ossf/scorecard-action?tab=readme-ov-file#authentication-with-fine-grained-pat-optional.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Public repositories:
          #   - Tüketicilerin erişimi için sonuçları OpenSSF REST API üzerinde yayımlar.
          #   - Deponun Scorecard rozeti eklemesini sağlar.
          #   - Ayrıntılar: https://github.com/ossf/scorecard-action#publishing-results.
          # Özel depolar için:
          #   - publish_results burada yazılan değerden bağımsız
          #     her zaman false olur.
          publish_results: true

          # İsteğe bağlı: .gitattributes içinde export-ignore varsa file_mode açılır.
          # file_mode: git

      # Sonuçları çıktı olarak yüklemek isteğe bağlıdır. Kapatılırsa SARIF sonuçları
      # deponun Actions sekmesine yüklenmez.
      - name: "Upload artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # GitHub kod tarama panosuna sonuç yükleme isteğe bağlıdır.
      # Commenting out will disable upload of results to your repo's Code Scanning dashboard
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
