name: Validate state memo dependency fix

on:
  push:
    branches:
      - agent/architecture-foundation-refactor

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-foundation-refactor
          fetch-depth: 0

      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Apply fix and validate production build
        shell: bash
        run: |
          set +e
          LOG=/tmp/state-memo-validation.txt
          : > "$LOG"

          node scripts/fix-state-memo-deps.mjs >>"$LOG" 2>&1
          FIX_STATUS=$?
          npm ci >>"$LOG" 2>&1
          INSTALL_STATUS=$?
          CI=true npm run lint >>"$LOG" 2>&1
          LINT_STATUS=$?
          LINT_ACCEPTED=0
          if [ "$LINT_STATUS" -ne 0 ] && ! grep -q 'How would you like to configure ESLint' "$LOG"; then
            LINT_ACCEPTED=1
          fi
          npm run build >>"$LOG" 2>&1
          BUILD_STATUS=$?

          node <<'NODE' >>"$LOG" 2>&1
          const fs = require('fs');
          const tasks = fs.readFileSync('src/features/tasks/TasksView.jsx', 'utf8');
          const team = fs.readFileSync('src/features/team/TeamView.jsx', 'utf8');
          if (!tasks.includes('})), [projects]);')) throw new Error('Project memo dependency was not updated.');
          if (!tasks.includes('})), [people]);')) throw new Error('People memo dependency was not updated.');
          if (!team.includes('}, [tasks, people]);')) throw new Error('Team memo dependency was not updated.');
          const featureFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = `${dir}/${entry.name}`;
              if (entry.isDirectory()) walk(full);
              else if (/\.(?:js|jsx)$/.test(full)) featureFiles.push(full);
            }
          }
          walk('src/features');
          for (const file of featureFiles) {
            const source = fs.readFileSync(file, 'utf8');
            if (/\b(?:PROJECTS|PEOPLE|TASKS)\b/.test(source)) throw new Error(`Legacy raw-data identifier remains in ${file}`);
            if (/data\/mock\/seed|(?:^|\/)lib\/data/.test(source)) throw new Error(`Feature bypasses data/state boundary in ${file}`);
          }
          NODE
          ARCH_STATUS=$?

          if grep -R -E 'fonts\.googleapis\.com|fonts\.gstatic\.com' src >>"$LOG" 2>&1; then
            OFFLINE_STATUS=1
          elif grep -R -E '<script[^>]+https?://|<link[^>]+https?://' src >>"$LOG" 2>&1; then
            OFFLINE_STATUS=1
          else
            OFFLINE_STATUS=0
          fi

          printf 'RESULT fix=%s install=%s lint=%s lintAccepted=%s build=%s architecture=%s offline=%s\n' \
            "$FIX_STATUS" "$INSTALL_STATUS" "$LINT_STATUS" "$LINT_ACCEPTED" "$BUILD_STATUS" "$ARCH_STATUS" "$OFFLINE_STATUS" >>"$LOG"
          cat "$LOG"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/state-memo-validation.yml
          rm -f scripts/fix-state-memo-deps.mjs
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          if [ "$FIX_STATUS" -ne 0 ] || [ "$INSTALL_STATUS" -ne 0 ] || [ "$LINT_ACCEPTED" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ] || [ "$ARCH_STATUS" -ne 0 ] || [ "$OFFLINE_STATUS" -ne 0 ]; then
            cp "$LOG" docs/state-memo-validation-failure.txt
            git add -A -f docs/state-memo-validation-failure.txt
            git add -A
            git commit -m 'Record state memo validation failure'
            git push origin HEAD:agent/architecture-foundation-refactor
            exit 1
          fi

          rm -f docs/state-memo-validation-failure.txt
          git add -A
          git commit -m 'Fix state-backed memo dependencies'
          git push origin HEAD:agent/architecture-foundation-refactor
